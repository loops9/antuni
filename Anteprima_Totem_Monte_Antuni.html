&lt;style&gt;
#utensili-kiosk .welcome{display:grid;grid-template-rows:auto 1fr auto;min-height:1016px;padding:0;background:#171b17;color:#fffdf7}

#utensili-kiosk .welcome&gt;div,#utensili-kiosk .welcome&gt;div:last-child{position:relative;z-index:2;background:transparent;padding:0}
